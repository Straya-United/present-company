# Render Blueprint: one Node web service. Set QLOO_API_KEY and OPENAI_API_KEY as secrets in the dashboard.
services:
  - type: web
    name: present-company
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.19.0
      - key: OPENAI_MODEL
        value: gpt-5.6-terra
      - key: QLOO_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
